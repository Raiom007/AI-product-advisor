[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor"
version = "0.1.0"
requires-python = ">=3.11"
# WHY: src layout keeps the package off sys.path until explicitly installed,
# preventing accidental imports of un-installed code in tests.

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff — linter (replaces flake8 + isort + pyupgrade)
# WHY: single fast tool; configured once here (§9 "Tests" row).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"   # enables match-statement, newer f-string syntax, etc.
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long — ruff format handles this
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # allows `import advisor` without pip install -e .
addopts = "-v --tb=short"
env = [
    "ADVISOR_PROFILE=dev",   # all tests run against the fake provider
]
