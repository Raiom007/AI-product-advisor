# configs/models.yaml — role → ordered candidate list
roles:
  parser:
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        needs: ["structured_output"]
        params: {temperature: 0, max_tokens: 512}
      - provider: gemini
        model: gemini-3.5-flash
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 512}
      - provider: gemini
        model: gemini-3.1-flash-lite
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 512}
      - provider: fake
        model: fake-parser
        needs: []
        params: {}

  summarizer:
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        needs: ["structured_output"]
        params: {temperature: 0, max_tokens: 1024}
      - provider: gemini
        model: gemini-3.5-flash
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 1024}
      - provider: gemini
        model: gemini-3.1-flash-lite
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 1024}
      - provider: fake
        model: fake-summarizer
        needs: []
        params: {}

  vision:
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        needs: ["vision"]
        params: {temperature: 0, max_tokens: 512}
      - provider: gemini
        model: gemini-3.5-flash
        needs: ["vision"]
        params: {temperature: 0, max_output_tokens: 512}
      - provider: fake
        model: fake-vision
        needs: []
        params: {}

  composer:
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        needs: []
        params: {temperature: 0, max_tokens: 2048}
      - provider: gemini
        model: gemini-3.5-flash
        needs: []
        params: {temperature: 0, max_output_tokens: 2048}
      - provider: gemini
        model: gemini-3.1-flash-lite
        needs: []
        params: {temperature: 0, max_output_tokens: 2048}
      - provider: fake
        model: fake-composer
        needs: []
        params: {}

  planner:
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        needs: ["structured_output"]
        params: {temperature: 0, max_tokens: 256}
      - provider: gemini
        model: gemini-3.5-flash
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 256}
      - provider: gemini
        model: gemini-3.1-flash-lite
        needs: ["structured_output"]
        params: {temperature: 0, max_output_tokens: 256}
      - provider: fake
        model: fake-planner
        needs: []
        params: {}

embedder:
  provider: local
  model: "BAAI/bge-small-en-v1.5"
