# configs/data.yaml — CSV column mapping and cleaning switches
# WHY: §0 A4 — "Catalogue has messy columns; exact names unknown until
# data arrives." Fill after running `make ingest` (P4 data profiling).
# ⚠ PLACEHOLDER — column names below are UNKNOWN until CSVs arrive.

products:
  id_col: UNKNOWN
  name_col: UNKNOWN
  brand_col: UNKNOWN
  price_retail_col: UNKNOWN
  price_discounted_col: UNKNOWN  # WHY: used as effective price for budget filter (§5.1)
  category_col: UNKNOWN
  description_col: UNKNOWN
  specs_col: UNKNOWN             # free-text specs field → parsed by specs_parser.py
  image_urls_col: UNKNOWN
  image_url_separator: "|"      # most common separator; verify in profile

reviews:
  id_col: UNKNOWN
  product_id_col: UNKNOWN        # join key to products
  text_col: UNKNOWN
  rating_col: UNKNOWN            # numeric; scale assumed 1-5, verify in profile
  date_col: UNKNOWN
  helpful_votes_col: UNKNOWN
  reviewer_id_col: UNKNOWN

cleaning:
  dedupe: true
  pii_redact: true               # WHY: PII redacted at ingest, never stored (§5.1, §5.8)
  injection_flag: true           # WHY: flag, never delete — data, not instructions (§5.8)
  price_currency: INR
  price_effective_field: price_discounted   # field used for budget constraints
